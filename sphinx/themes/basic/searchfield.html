{# Sphinx sidebar template: search field.

This component is similar to searchbox.html but does not include an
extra heading ("Quick search"). Instead, it uses a placeholder text
in the search field.
#}
{%- if pagename != "search" and builder != "singlehtml" %}
<search id="searchbox" style="display: none" role="search">
    <div class="searchformwrapper">
    <form class="search" action="{{ pathto('search') }}" method="get">
      <input type="text" name="q" aria-labelledby="searchlabel" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Search"/>
      <input type="submit" value="{{ _('Go') }}" />
    </form>
    </div>
</search>
<script>
/* @license magnet:?xt=urn:btih:87f119ba0b429ba17a44b4bffcab33165ebdacc0&dn=freebsd.txt BSD-2-Clause
 * SPDX-FileCopyrightText: Copyright 2007-2024 by the Sphinx team
 * SPDX-License-Identifier: BSD-2-Clause
 */
document.getElementById('searchbox').style.display = "block";
/* @license-end */
</script>
{%- endif %}
